<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck genérico de prueba</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4efe6; color: #222; font-family: Georgia, serif; }
  .page { position: fixed; inset: 0; display: none; place-items: center; font-size: clamp(2rem, 7vw, 5rem); }
  .page.on { display: grid; }
</style>
</head>
<body>
<div class="page on">Uno</div>
<div class="page">Dos</div>
<div class="page">Tres</div>
<aside class="notes">Este deck no es html-slides: este texto se queda tal cual.</aside>
<script>
  const pages = [...document.querySelectorAll('.page')];
  let k = 0;
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') k = Math.min(pages.length - 1, k + 1);
    else if (e.key === 'ArrowLeft') k = Math.max(0, k - 1);
    else return;
    pages.forEach((p, j) => p.classList.toggle('on', j === k));
  });
</script>
</body>
</html>
