<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck de prueba</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #f5f5f5; font-family: system-ui, sans-serif; }
  .slide { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 2rem; }
  .slide.active { display: grid; }
  h1 { font-size: clamp(2rem, 8vw, 6rem); margin: 0; }
  p { font-size: clamp(1rem, 3vw, 2rem); color: #aaa; }
  .notes { display: none; }
  body.show-notes .slide.active .notes { display: block; position: fixed; left: 16px; right: 16px; bottom: 40px; background: #f5f5f5; color: #111; padding: 1rem; }
  .counter { position: fixed; right: 20px; bottom: 16px; color: #888; }
</style>
</head>
<body>
<section class="slide">
  <div><h1>Deck de prueba</h1><p>Usa ← → para avanzar</p></div>
  <aside class="notes">Nota 1: saluda y presenta el tema.</aside>
</section>
<section class="slide">
  <div><h1>Segunda slide</h1><p>Una idea por slide</p></div>
  <aside class="notes">Nota 2: explica la idea con un ejemplo.</aside>
</section>
<section class="slide">
  <div><h1>Fin</h1><p>Gracias</p></div>
  <aside class="notes">Nota 3: abre la ronda de preguntas.</aside>
</section>
<div class="counter"></div>
<script>
  // Imita el motor de la skill html-slides: show(n), teclas, clic, N y `slidechange`.
  const slides = [...document.querySelectorAll('.slide')];
  const counter = document.querySelector('.counter');
  let i = 0;
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach((s, k) => s.classList.toggle('active', k === i));
    counter.textContent = (i + 1) + ' / ' + slides.length;
    document.dispatchEvent(new CustomEvent('slidechange', { detail: { index: i, slide: slides[i] } }));
  }
  document.addEventListener('keydown', e => {
    if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); show(i + 1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(i - 1); }
    else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('show-notes');
  });
  document.addEventListener('click', () => show(i + 1));
  show(0);
</script>
</body>
</html>
