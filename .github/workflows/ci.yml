name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # La misma versión de npm que en local: npm 10 y 11 no escriben igual el lockfile.
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Cada push a main con los tests en verde se despliega (#12).
  # Los secretos salen de scripts/setup.sh.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # La misma versión de npm que en local: npm 10 y 11 no escriben igual el lockfile.
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - name: Migraciones de D1
        working-directory: apps/app
        run: npx wrangler d1 migrations apply DB --remote
      - name: Desplegar la app
        working-directory: apps/app
        run: npx wrangler deploy
      - name: Secretos de la app
        working-directory: apps/app
        env:
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        # GitHub reserva el prefijo GITHUB_, por eso los secretos se llaman OAUTH_*.
        run: |
          node -e '
            const e = process.env;
            console.log(JSON.stringify({
              GITHUB_CLIENT_ID: e.OAUTH_GITHUB_CLIENT_ID,
              GITHUB_CLIENT_SECRET: e.OAUTH_GITHUB_CLIENT_SECRET,
              GOOGLE_CLIENT_ID: e.OAUTH_GOOGLE_CLIENT_ID,
              GOOGLE_CLIENT_SECRET: e.OAUTH_GOOGLE_CLIENT_SECRET,
              SESSION_SECRET: e.SESSION_SECRET,
            }));
          ' | npx wrangler secret bulk
      - name: Desplegar los decks
        working-directory: apps/decks
        run: npx wrangler deploy
